<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Happy Diwali</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#02030c;font-family:'Poppins','Segoe UI',system-ui,sans-serif;color:#fff;user-select:none;-webkit-user-select:none;touch-action:manipulation}
canvas#sky{position:fixed;inset:0;display:block}

/* ---------- top title (shown after Celebrate) ---------- */
#hud{position:fixed;top:12px;left:0;right:0;text-align:center;pointer-events:none;opacity:0;transition:opacity 1.4s .6s;z-index:5;
  font-family:'Great Vibes',cursive;font-size:clamp(28px,7vw,46px);color:#ffd980;text-shadow:0 0 18px rgba(255,170,40,.85)}
#hud small{display:block;font-family:'Poppins',sans-serif;font-size:clamp(10px,2.6vw,13px);letter-spacing:.2em;color:#ffc8a0;opacity:.85;text-transform:uppercase;margin-top:0}
body.live #hud{opacity:1}

#mute{position:fixed;top:10px;left:10px;z-index:30;width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,200,120,.4);
  background:rgba(20,10,30,.55);color:#fff;font-size:17px;cursor:pointer}

/* ---------- greeting card ---------- */
#overlay{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:18px;
  background:radial-gradient(ellipse at center,rgba(30,10,50,.5),rgba(2,3,12,.9));backdrop-filter:blur(3px);
  transition:opacity .9s,visibility .9s}
#overlay.hide{opacity:0;visibility:hidden;pointer-events:none}
.card{position:relative;width:min(92vw,440px);max-height:96vh;overflow:auto;padding:22px 24px 26px;border-radius:26px;text-align:center;
  background:linear-gradient(160deg,#3a0b1e 0%,#1d0a3a 55%,#2b0f2f 100%);border:1.5px solid rgba(255,196,90,.7);
  box-shadow:0 0 0 6px rgba(255,170,60,.08),0 0 60px rgba(255,140,30,.35),inset 0 0 40px rgba(255,150,40,.12);
  animation:pop .9s cubic-bezier(.2,1.3,.4,1) both}
@keyframes pop{from{transform:scale(.6) translateY(30px);opacity:0}to{transform:none;opacity:1}}
.diya{width:min(62%,220px);margin:0 auto;display:block;overflow:visible}
.glow{animation:pulse 2s ease-in-out infinite alternate;transform-origin:100px 52px}
@keyframes pulse{from{opacity:.55;transform:scale(.92)}to{opacity:1;transform:scale(1.08)}}
.flame{transform-origin:100px 76px;animation:flick 1.1s ease-in-out infinite alternate}
@keyframes flick{0%{transform:scale(1,1) skewX(0)}50%{transform:scale(.95,1.07) skewX(2deg)}100%{transform:scale(1.05,.95) skewX(-2deg)}}
.card h1{font-family:'Great Vibes',cursive;font-weight:400;font-size:clamp(44px,13vw,64px);line-height:1.05;margin-top:2px;
  background:linear-gradient(90deg,#ffd36b,#fff4c8,#ff9a3c,#ffd36b);background-size:200% auto;-webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;animation:shine 4s linear infinite}
@keyframes shine{to{background-position:200% center}}
.from{margin-top:4px;font-size:15px;letter-spacing:.1em;color:#ffcf9a}
.from b{color:#fff;font-weight:700;letter-spacing:.06em}
.orn{margin:10px 0 0;color:#ffc65c;letter-spacing:.5em;font-size:12px}
.msg{margin:10px 0 22px;font-size:14.5px;line-height:1.7;color:#f6dfe6}
#celebrate{border:0;cursor:pointer;padding:14px 38px;border-radius:40px;font:700 17px 'Poppins',sans-serif;color:#3a0b1e;letter-spacing:.04em;
  background:linear-gradient(135deg,#fff1a8,#ffbe3a 50%,#ff8a1f);box-shadow:0 0 28px rgba(255,170,50,.7),0 6px 0 #b4560f;animation:bob 1.6s ease-in-out infinite}
#celebrate:active{transform:translateY(4px);box-shadow:0 0 20px rgba(255,170,50,.7),0 2px 0 #b4560f}
@keyframes bob{50%{transform:translateY(-3px)}}

/* ---------- bottom controls ---------- */
#controls{position:fixed;left:0;right:0;bottom:0;z-index:10;padding:30px 14px calc(16px + env(safe-area-inset-bottom));
  background:linear-gradient(to top,rgba(4,3,14,.97) 58%,rgba(4,3,14,0));display:flex;flex-direction:column;gap:12px;align-items:center;
  transform:translateY(135%);transition:transform .9s cubic-bezier(.2,.9,.3,1) .35s}
body.live #controls{transform:none}
.row{display:flex;gap:10px;width:min(100%,520px)}
.fx{flex:1;border:0;cursor:pointer;color:#fff;border-radius:18px;padding:12px 4px 11px;font-family:'Poppins',sans-serif;font-weight:600;font-size:clamp(14px,4vw,17px);
  display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:0 5px 0 rgba(0,0,0,.45),0 0 18px var(--c);transition:transform .08s}
.fx i{font-style:normal;font-size:26px;line-height:1}
.fx:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.45),0 0 12px var(--c)}
#b-chatai{background:linear-gradient(160deg,#ff5a3c,#b3171f);--c:rgba(255,80,50,.55)}
#b-anar{background:linear-gradient(160deg,#ffcf3a,#e0731a);--c:rgba(255,190,50,.55);color:#3a1600}
#b-bomb{background:linear-gradient(160deg,#8a4dff,#3a1a86);--c:rgba(140,90,255,.55)}
#b-rocket{width:min(100%,520px);padding:15px;font-size:clamp(17px,4.6vw,20px);letter-spacing:.14em;text-transform:uppercase;flex-direction:row;justify-content:center;gap:12px;
  background:linear-gradient(90deg,#ff2d75,#ff7a1a 50%,#ffd13a);--c:rgba(255,100,60,.7);color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.4)}
</style>
</head>
<body>

<!-- ============================================================
     EDIT HERE: change the names / texts, nothing else needed.
     ============================================================ -->
<script>
const CONFIG = {
  SENDER_NAME : "Saurav",    // who is sending the wish (shown on the card)
  PERSON_NAME : "Ansu Deede",    // name printed in the sky by Anar and Roket  (change to the receiver's name)
  TITLE       : "Happy Diwali",
  MESSAGE     : "May the divine light of Diwali fill your life with peace, prosperity, good health and endless happiness. " +
                "May every diya you light chase away the darkness and bring you closer to your dreams. " +
                "Wishing you and your family a sparkling, joyful and truly blessed Diwali!",
  BUTTON_TEXT : "Celebrate ✨"
};






</script>

<canvas id="sky"></canvas>

<div id="hud"><span id="hudTitle"></span><small id="hudFrom"></small></div>
<button id="mute" title="Sound on/off">🔊</button>

<!-- greeting card -->
<div id="overlay">
  <div class="card">
    <svg class="diya" viewBox="0 0 200 140" aria-hidden="true">
      <defs>
        <radialGradient id="gl" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ffd36b" stop-opacity=".9"/><stop offset=".5" stop-color="#ff9a1f" stop-opacity=".35"/><stop offset="1" stop-color="#ff7a00" stop-opacity="0"/></radialGradient>
        <linearGradient id="bowl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e2692a"/><stop offset="1" stop-color="#7d2a0c"/></linearGradient>
        <linearGradient id="fl" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ff7a00"/><stop offset=".6" stop-color="#ffb62e"/><stop offset="1" stop-color="#fff1a8"/></linearGradient>
      </defs>
      <ellipse class="glow" cx="100" cy="52" rx="78" ry="62" fill="url(#gl)"/>
      <path d="M18 82 C34 128 166 128 182 82 C150 94 50 94 18 82Z" fill="url(#bowl)"/>
      <path d="M18 82 Q6 76 4 66 Q20 68 34 80Z" fill="#c9561f"/>
      <ellipse cx="100" cy="82" rx="82" ry="10" fill="#f08a3c"/>
      <ellipse cx="100" cy="82" rx="70" ry="6.5" fill="#3b1206"/>
      <circle cx="70" cy="104" r="3" fill="#ffd36b"/><circle cx="100" cy="108" r="3" fill="#ffd36b"/><circle cx="130" cy="104" r="3" fill="#ffd36b"/>
      <ellipse cx="100" cy="120" rx="30" ry="5" fill="#000" opacity=".25"/>
      <rect x="97" y="68" width="6" height="14" rx="2" fill="#3a2410"/>
      <g class="flame">
        <path d="M100 18 C120 44 124 62 100 76 C76 62 80 44 100 18Z" fill="url(#fl)"/>
        <path d="M100 46 C109 58 109 68 100 74 C91 68 91 58 100 46Z" fill="#fff8d8"/>
      </g>
    </svg>
    <h1 id="cTitle"></h1>
    <div class="from">from <b id="cFrom"></b></div>
    <div class="orn">✦ ✦ ✦</div>
    <p class="msg" id="cMsg"></p>
    <button id="celebrate"></button>
  </div>
</div>

<!-- bottom buttons -->
<div id="controls">
  <div class="row">
    <button class="fx" id="b-chatai" data-act="chatai"><i>🧨</i>Chatai</button>
    <button class="fx" id="b-anar"   data-act="anar"><i>🎇</i>Anar</button>
    <button class="fx" id="b-bomb"   data-act="bomb"><i>💣</i>Bomb</button>
  </div>
  <button class="fx" id="b-rocket" data-act="rocket"><i>🚀</i>Roket</button>
</div>

<script>
(function(){
'use strict';

/* ---------- fill texts from CONFIG ---------- */
document.title = CONFIG.TITLE + " - " + CONFIG.SENDER_NAME;
document.getElementById('cTitle').textContent = CONFIG.TITLE;
document.getElementById('cFrom').textContent  = CONFIG.SENDER_NAME;
document.getElementById('cMsg').textContent   = CONFIG.MESSAGE;
document.getElementById('celebrate').textContent = CONFIG.BUTTON_TEXT;
document.getElementById('hudTitle').textContent = CONFIG.TITLE;
document.getElementById('hudFrom').textContent  = "from " + CONFIG.SENDER_NAME;

/* ---------- helpers ---------- */
const cv = document.getElementById('sky'), ctx = cv.getContext('2d');
const controls = document.getElementById('controls');
const rand  = (a,b)=>a+Math.random()*(b-a);
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const later = (ms,fn)=>setTimeout(fn,ms);
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

let W=0,H=0,dpr=1,groundY=0,T=0,flash=0,shake=0;
const bg = document.createElement('canvas');
let stars=[], diyas=[];
const sc = ()=>clamp(H/800,.62,1.3);

/* ---------- sound (synthesised, no files) ---------- */
let actx=null, noise=null, soundOn=true, lastBoom=0;
function initAudio(){
  try{
    if(!actx){
      actx=new (window.AudioContext||window.webkitAudioContext)();
      const n=actx.sampleRate*2; noise=actx.createBuffer(1,n,actx.sampleRate);
      const d=noise.getChannelData(0); for(let i=0;i<n;i++) d[i]=Math.random()*2-1;
    }
    if(actx.state==='suspended') actx.resume();
  }catch(e){}
}
function snd(type,vol,f0,f1,dur,q){
  if(!actx||!soundOn) return;
  const t=actx.currentTime, src=actx.createBufferSource();
  src.buffer=noise; src.loop=true;
  const f=actx.createBiquadFilter(); f.type=type; f.Q.value=q||1;
  f.frequency.setValueAtTime(f0,t); f.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);
  const g=actx.createGain(); g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(vol,t+0.01); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  src.connect(f); f.connect(g); g.connect(actx.destination); src.start(t,Math.random()); src.stop(t+dur+0.05);
}
function boom(v=1,low=1800,dur=1){
  const n=performance.now(); if(n-lastBoom<35) return; lastBoom=n;
  snd('lowpass',v,low,50,dur,0.7); snd('lowpass',v*0.5,5000,200,0.14,0.5);
}
const crack =v=>snd('highpass',v,6000,3000,0.07,0.8);
const whoosh=d=>snd('bandpass',0.35,400,2500,d,2);
const hiss  =(d,v)=>snd('bandpass',v,3500,3500,d,0.8);
const muteBtn=document.getElementById('mute');
muteBtn.onclick=()=>{ soundOn=!soundOn; muteBtn.textContent=soundOn?'🔊':'🔇'; initAudio(); };

/* ---------- night sky background ---------- */
function resize(){
  dpr=Math.min(window.devicePixelRatio||1,2);
  W=innerWidth; H=innerHeight;
  cv.width=W*dpr; cv.height=H*dpr; cv.style.width=W+'px'; cv.style.height=H+'px';
  groundY=Math.max(H*0.5, H-(controls.offsetHeight||0)-8);
  stars=[]; const n=Math.round(W*groundY/5500);
  for(let i=0;i<n;i++) stars.push({x:Math.random()*W,y:Math.random()*groundY*0.95,r:Math.random()<.15?2:1.2,ph:rand(0,6.28),sp:rand(.8,3)});
  buildBg();
}
function buildBg(){
  bg.width=W*dpr; bg.height=H*dpr;
  const b=bg.getContext('2d'); b.setTransform(dpr,0,0,dpr,0,0);
  const g=b.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#02030c'); g.addColorStop(.55,'#0a1030'); g.addColorStop(.85,'#1b1440'); g.addColorStop(1,'#2a1744');
  b.fillStyle=g; b.fillRect(0,0,W,H);
  const hg=b.createRadialGradient(W/2,groundY,10,W/2,groundY,W*0.75);
  hg.addColorStop(0,'rgba(255,140,40,.3)'); hg.addColorStop(1,'rgba(255,140,40,0)');
  b.fillStyle=hg; b.fillRect(0,0,W,H);
  // moon
  const mr=clamp(W*0.04,15,28), mx=W*0.86, my=Math.max(mr+66,H*0.16);
  const mg=b.createRadialGradient(mx,my,mr*.5,mx,my,mr*4);
  mg.addColorStop(0,'rgba(255,245,210,.35)'); mg.addColorStop(1,'rgba(255,245,210,0)');
  b.fillStyle=mg; b.fillRect(mx-mr*4,my-mr*4,mr*8,mr*8);
  b.fillStyle='#fff3cf'; b.beginPath(); b.arc(mx,my,mr,0,6.2832); b.arc(mx+mr*.5,my-mr*.15,mr*.86,0,6.2832,true); b.fill();
  // skyline
  const r=mulberry(11); let x=-20; const maxH=Math.min(H*0.16,150);
  while(x<W+20){
    const w=28+r()*46, h=maxH*(0.25+r()*0.75), top=groundY-h;
    b.fillStyle='#070618'; b.fillRect(x,top,w,h+(H-groundY));
    if(r()<0.28){ b.beginPath(); b.arc(x+w/2,top,w*0.38,Math.PI,0); b.fill(); b.fillRect(x+w/2-1,top-w*0.38-9,2,9); }
    for(let wy=top+8;wy<groundY-6;wy+=11) for(let wx=x+5;wx<x+w-6;wx+=9){
      if(r()<0.35){ b.fillStyle=r()<0.5?'rgba(255,200,90,.85)':'rgba(255,150,60,.7)'; b.fillRect(wx,wy,3,4); }
    }
    x+=w+r()*4;
  }
  b.fillStyle='#04030c'; b.fillRect(0,groundY,W,H-groundY);
  // row of diyas on the ground
  const dN=Math.max(6,Math.floor(W/46)); diyas=[];
  for(let i=0;i<dN;i++){
    const dx=(i+.5)*W/dN; diyas.push({x:dx,ph:rand(0,6.28)});
    b.fillStyle='#c0561d'; b.beginPath(); b.moveTo(dx-9,groundY-3); b.quadraticCurveTo(dx,groundY+9,dx+9,groundY-3); b.closePath(); b.fill();
  }
}

/* ---------- particle systems ---------- */
const P=[],S=[],L=[],FX=[],TP=[];
const off=document.createElement('canvas'), octx=off.getContext('2d',{willReadFrequently:true});
const FONT=s=>`700 ${s}px Poppins,"Segoe UI",Arial,sans-serif`;

function spark(x,y,vx,vy,o){
  if(P.length>6000) return;
  P.push({x,y,vx,vy,life:o.life,max:o.life,size:o.size||2,h:o.h,s:o.s??100,l:o.l??60,g:o.g??300,drag:o.drag??0.97,tw:o.tw||0});
}
function burst(x,y,o){
  const n=o.n||80, sp=o.speed||250, life=o.life||1.4, size=o.size||2, g=o.g??160, drag=o.drag??0.965;
  const h0=o.hue??rand(0,360), hs=o.hueSpread??18;
  for(let i=0;i<n;i++){
    const a=o.ring? i/n*6.2832 : rand(0,6.2832);
    const s=o.ring? sp*rand(.96,1.04) : sp*(0.35+0.65*Math.sqrt(Math.random()));
    spark(x,y,Math.cos(a)*s,Math.sin(a)*s,{life:life*rand(.7,1.2),h:o.multi?rand(0,360):h0+rand(-hs,hs),l:o.l??rand(55,75),size,g,drag,tw:o.tw||0});
  }
}
function smoke(x,y,o={}){
  if(S.length>220) return;
  const life=o.life||2.5;
  S.push({x,y,vx:o.vx??rand(-15,15),vy:o.vy??-rand(15,40),r:o.r||8,gr:o.gr||25,life,max:life,a:o.a||.3,tone:Math.round(o.tone||150)});
}
function light(x,y,r,h,life,a=.5){ if(L.length>45) return; L.push({x,y,r,h,life,max:life,a}); }
function shock(x,y,r1,h,dur=.6,lw=6){
  let t=0;
  FX.push({update(dt){t+=dt;if(t>=dur)this.done=true;},
    glow(c){const k=t/dur,e=1-Math.pow(1-k,3);c.strokeStyle=`hsla(${h},100%,70%,${(1-k)*.8})`;c.lineWidth=lw*(1-k)+1;c.beginPath();c.arc(x,y,r1*e,0,6.2832);c.stroke();}});
}

/* name made of glowing particles */
function nameText(text,cx,cy,sx,sy,o={}){
  text=String(text||'').trim(); if(!text) return;
  const maxW=o.maxW||Math.min(W*.86,680);
  octx.font=FONT(100); const w100=octx.measureText(text).width||1;
  const fs=Math.min(100*maxW/w100,o.maxFs||140), tw=w100*fs/100;
  off.width=Math.ceil(tw+24); off.height=Math.ceil(fs*1.5);
  octx.font=FONT(fs); octx.textAlign='center'; octx.textBaseline='middle'; octx.fillStyle='#fff';
  octx.fillText(text,off.width/2,off.height/2+fs*.04);
  const d=octx.getImageData(0,0,off.width,off.height).data;
  const step=Math.max(3,Math.round(fs/17)), pts=[];
  for(let y=0;y<off.height;y+=step) for(let x=0;x<off.width;x+=step) if(d[(y*off.width+x)*4+3]>110) pts.push(x,y);
  const keep=Math.min(1,(o.cap||850)/(pts.length/2||1)), h0=rand(0,360);
  for(let i=0;i<pts.length;i+=2){
    if(Math.random()>keep) continue;
    const px=pts[i]-off.width/2, py=pts[i+1]-off.height/2;
    TP.push({sx:sx+rand(-8,8),sy:sy+rand(-8,8),tx:cx+px,ty:cy+py,t:-rand(0,.3),fly:o.fly||.9,hold:o.hold||1.8,fade:.7,
      col:`hsl(${Math.round((h0+px/tw*170+360)%360)},100%,${Math.round(rand(60,72))}%)`,ph:rand(0,6.28),x:sx,y:sy,a:0});
  }
}

/* ---------- update ---------- */
function updateAll(dt){
  for(let i=FX.length-1;i>=0;i--){ const f=FX[i]; f.update(dt); if(f.done) FX.splice(i,1); }
  for(let i=P.length-1;i>=0;i--){
    const p=P[i]; p.life-=dt; if(p.life<=0){P[i]=P[P.length-1];P.pop();continue;}
    const d=Math.pow(p.drag,dt*60); p.vx*=d; p.vy*=d; p.vy+=p.g*dt; p.x+=p.vx*dt; p.y+=p.vy*dt;
  }
  for(let i=S.length-1;i>=0;i--){
    const s=S[i]; s.life-=dt; if(s.life<=0){S[i]=S[S.length-1];S.pop();continue;}
    s.x+=s.vx*dt; s.y+=s.vy*dt; s.vx*=Math.pow(.6,dt); s.r+=s.gr*dt;
  }
  for(let i=L.length-1;i>=0;i--){ L[i].life-=dt; if(L[i].life<=0){L[i]=L[L.length-1];L.pop();} }
  for(let i=TP.length-1;i>=0;i--){
    const p=TP[i]; p.t+=dt;
    if(p.t>=p.fly+p.hold+p.fade){TP[i]=TP[TP.length-1];TP.pop();continue;}
    if(p.t<0){p.a=0;continue;}
    const k=Math.min(1,p.t/p.fly), e=1-Math.pow(1-k,3);
    p.x=p.sx+(p.tx-p.sx)*e; p.y=p.sy+(p.ty-p.sy)*e;
    let a;
    if(k>=1){
      p.x+=Math.sin(T*8+p.ph)*.7; p.y+=Math.cos(T*7+p.ph)*.7; a=1;
      const f=(p.t-p.fly-p.hold)/p.fade; if(f>0){a=1-f;p.y+=f*f*70;}
    } else a=.4+.6*k;
    p.a=a*(.75+.25*Math.sin(T*14+p.ph*5));
  }
  flash=Math.max(0,flash-dt*1.8);
}

/* ---------- draw ---------- */
function draw(){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.globalCompositeOperation='source-over'; ctx.globalAlpha=1;
  ctx.save();
  if(shake>.3){ ctx.translate(rand(-shake,shake),rand(-shake,shake)); shake*=Math.pow(.02,1/60); } else shake=0;
  ctx.drawImage(bg,0,0,W,H);
  ctx.fillStyle='#fff';
  for(const s of stars){ ctx.globalAlpha=.35+.65*Math.abs(Math.sin(T*s.sp+s.ph)); ctx.fillRect(s.x,s.y,s.r,s.r); }
  ctx.globalAlpha=1;

  for(const f of FX) if(f.base) f.base(ctx);

  for(const s of S){ // smoke
    const k=s.life/s.max, al=s.a*Math.min(1,(1-k)*6)*Math.min(1,k*1.6), t=s.tone;
    const g=ctx.createRadialGradient(s.x,s.y,0,s.x,s.y,s.r);
    g.addColorStop(0,`rgba(${t},${t},${t+12},${al})`); g.addColorStop(1,`rgba(${t},${t},${t+12},0)`);
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,6.2832); ctx.fill();
  }

  ctx.globalCompositeOperation='lighter';
  for(const d of diyas){ // flickering diya flames
    const f=.8+.2*Math.sin(T*9+d.ph)+.08*Math.sin(T*23+d.ph*3), gy=groundY-6;
    ctx.fillStyle='rgba(255,160,50,.16)'; ctx.beginPath(); ctx.arc(d.x,gy,15*f,0,6.2832); ctx.fill();
    ctx.fillStyle='rgba(255,210,100,.95)'; ctx.beginPath(); ctx.ellipse(d.x,gy-1,2.3*f,5*f,0,0,6.2832); ctx.fill();
  }
  for(const l of L){
    const k=l.life/l.max, g=ctx.createRadialGradient(l.x,l.y,0,l.x,l.y,l.r);
    g.addColorStop(0,`hsla(${l.h},100%,60%,${l.a*k})`); g.addColorStop(1,`hsla(${l.h},100%,50%,0)`);
    ctx.fillStyle=g; ctx.fillRect(l.x-l.r,l.y-l.r,l.r*2,l.r*2);
  }
  for(const f of FX) if(f.glow) f.glow(ctx);

  ctx.lineCap='round';
  for(const p of P){
    const a=p.life/p.max; let al=a<.5?a*2:1; if(p.tw&&Math.random()<p.tw) al*=.2;
    ctx.strokeStyle=`hsla(${Math.round(p.h)},${p.s}%,${Math.round(p.l)}%,${al})`;
    ctx.lineWidth=p.size*(.5+.5*a);
    ctx.beginPath(); ctx.moveTo(p.x-p.vx*.03,p.y-p.vy*.03); ctx.lineTo(p.x,p.y); ctx.stroke();
  }
  for(const p of TP){
    if(p.a<=0) continue;
    ctx.fillStyle=p.col;
    ctx.globalAlpha=p.a*.28; ctx.fillRect(p.x-4,p.y-4,8,8);
    ctx.globalAlpha=p.a;     ctx.fillRect(p.x-1.6,p.y-1.6,3.2,3.2);
  }
  ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over';
  ctx.restore();
  if(flash>0){ ctx.fillStyle=`rgba(255,240,220,${flash*.55})`; ctx.fillRect(0,0,W,H); }
}
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000); last=now; T+=dt;
  updateAll(dt); draw();
  requestAnimationFrame(frame);
}

/* ===========================================================
   1. CHATAI  – hanging string of crackers, blasts bottom to top
   =========================================================== */
function doChatai(){
  const k=sc(), x=W/2, Ltot=Math.min(groundY*.82,560), N=Math.max(26,Math.round(Ltot/15));
  const items=[]; for(let i=0;i<N;i++) items.push({y:18+i*(Ltot-18)/(N-1),blown:false,tb:.55+((N-1-i)/(N-1))*2.25,ang:(i%2?1:-1)*rand(.25,.5)});
  let t=0; whoosh(.4);
  FX.push({off:-(Ltot+30),
    update(dt){
      t+=dt; const kk=Math.min(1,t/.5); this.off=-(Ltot+30)*Math.pow(1-kk,2);
      for(const it of items){
        if(!it.blown&&t>=it.tb){
          it.blown=true; const cx=x, cy=this.off+it.y;
          light(cx,cy,70*k,rand(20,50),.16,.7);
          burst(cx,cy,{n:14,speed:rand(140,260)*k,hue:rand(15,55),life:.45,size:2,g:500,drag:.93});
          if(Math.random()<.25) burst(cx,cy,{n:10,speed:200*k,multi:true,life:.6,size:2,g:300});
          if(Math.random()<.3) smoke(cx,cy,{r:5,gr:26,life:1.3,a:.22});
          crack(.35); shake=Math.max(shake,2.5); flash=Math.max(flash,.05);
        }
      }
      let low=-1; for(const it of items) if(!it.blown) low=Math.max(low,it.y);
      if(low>=0&&t>.4) spark(x,this.off+low+8,rand(-70,70),rand(-160,-30),{life:rand(.15,.35),h:rand(35,55),l:80,size:1.6,g:400,drag:.94});
      if(t>3.05) this.done=true;
    },
    base(c){
      let low=-1; for(const it of items) if(!it.blown) low=Math.max(low,it.y);
      if(low<0) return;
      c.strokeStyle='#8a6a3a'; c.lineWidth=2; c.beginPath(); c.moveTo(x,-10); c.lineTo(x,this.off+low+6); c.stroke();
      for(const it of items){ if(it.blown) continue;
        c.save(); c.translate(x,this.off+it.y); c.rotate(it.ang);
        c.fillStyle='#c41e1e'; c.fillRect(-4.5,-8,9,16);
        c.fillStyle='#ffc93c'; c.fillRect(-4.5,-2,9,3);
        c.fillStyle='#7d0f0f'; c.fillRect(-4.5,-8,9,2);
        c.restore();
      }
    },
    glow(c){
      let low=-1; for(const it of items) if(!it.blown) low=Math.max(low,it.y);
      if(low<0||t<.3) return;
      c.fillStyle='rgba(255,210,120,.9)'; c.beginPath(); c.arc(x,this.off+low+9,3.5,0,6.2832); c.fill();
      c.fillStyle='rgba(255,150,40,.25)'; c.beginPath(); c.arc(x,this.off+low+9,14,0,6.2832); c.fill();
    }});
}

/* ===========================================================
   2. ANAR – 1s white/yellow, then 2s intense & colourful + name
   =========================================================== */
function drawPot(c,x,y,s){
  c.save(); c.translate(x,y); c.scale(s,s);
  c.beginPath(); c.moveTo(-22,0); c.lineTo(22,0); c.lineTo(15,-48); c.lineTo(-15,-48); c.closePath();
  const g=c.createLinearGradient(-22,0,22,0); g.addColorStop(0,'#7a1f10'); g.addColorStop(.5,'#e0502e'); g.addColorStop(1,'#6b1a0e');
  c.fillStyle=g; c.fill();
  const hw=yy=>22-7*(-yy/48);
  c.fillStyle='#f5c542'; c.fillRect(-hw(-12),-14,hw(-12)*2,4); c.fillRect(-hw(-34),-36,hw(-34)*2,4);
  c.fillStyle='#2b0d08'; c.fillRect(-12,-54,24,7);
  c.fillStyle='#000'; c.beginPath(); c.ellipse(0,-54,12,3,0,0,6.2832); c.fill();
  c.restore();
}
function doAnar(){
  const k=sc(), s=clamp(H/700,.85,1.4), ax=W/2+rand(-W*.1,W*.1), ay=groundY, mouthY=ay-54*s;
  const IGN=.7, B=1.7, END=3.7;
  let t=0, acc=0, named=false, ringT=0;
  later(IGN*1000,()=>hiss(END-IGN,.2));
  FX.push({
    update(dt){
      t+=dt;
      if(t<IGN){
        if(t>.3) spark(ax,mouthY,rand(-30,30),rand(-120,-40),{life:.25,h:45,l:80,size:1.5,g:100});
      } else if(t<END){
        const p2=t>=B; acc+=(p2?650:170)*dt;
        while(acc>=1){
          acc--; const a=-Math.PI/2+rand(-1,1)*(p2?.55:.32);
          if(!p2){
            const sp=rand(240,420)*k, white=Math.random()<.5;
            spark(ax+rand(-4,4),mouthY,Math.cos(a)*sp,Math.sin(a)*sp,{life:rand(.6,1),h:45,s:white?10:100,l:white?96:62,size:rand(1.4,2.2),g:650,drag:.985});
          } else {
            const sp=rand(300,760)*k;
            spark(ax+rand(-5,5),mouthY,Math.cos(a)*sp,Math.sin(a)*sp,{life:rand(.8,1.6),h:rand(0,360),l:rand(55,70),size:rand(2,3.2),g:650,drag:.985,tw:.08});
          }
        }
        light(ax,mouthY-40*k,p2?220*k:120*k,p2?(T*200)%360:45,.07,p2?.55:.4);
        if(Math.random()<dt*10) smoke(ax,mouthY,{r:8,gr:30,life:2,a:.2});
        if(p2){
          shake=Math.max(shake,2);
          ringT-=dt;
          if(ringT<=0){ ringT=.32; const bx=ax+rand(-90,90)*k, by=mouthY-rand(240,420)*k;
            burst(bx,by,{n:46,speed:170*k,multi:true,life:1.1,size:2,g:200}); light(bx,by,120*k,rand(0,360),.3,.6); crack(.25); }
          if(!named){ named=true;
            nameText(CONFIG.PERSON_NAME,W/2,Math.max(115,groundY*.32),ax,mouthY,{maxW:Math.min(W*.86,640),hold:1.9}); }
        }
      }
      if(t>=END&&!this.ended){ this.ended=true; for(let i=0;i<8;i++) smoke(ax+rand(-20,20),mouthY,{r:10,gr:35,life:rand(2,3),a:.25}); }
      if(t>END+.8) this.done=true;
    },
    base(c){ const pop=t<.25?Math.max(.01,1-Math.pow(1-t/.25,3)):1; drawPot(c,ax,ay,s*pop); },
    glow(c){ if(t>IGN-.4&&t<IGN+.05){ c.fillStyle='rgba(255,220,130,.9)'; c.beginPath(); c.arc(ax,mouthY,4,0,6.2832); c.fill(); } }
  });
}

/* ===========================================================
   3. BOMB – big blast on screen, smoke at the end
   =========================================================== */
function doBomb(){
  const k=sc(), s=clamp(H/700,.85,1.4), bx=W/2, r=17*s, by=groundY-r-6;
  const P0={x:bx+.3*r,y:by-.95*r}, C={x:bx+.9*r,y:by-2.1*r}, P1={x:bx+1.6*r,y:by-1.9*r};
  const bez=q=>({x:(1-q)*(1-q)*P0.x+2*(1-q)*q*C.x+q*q*P1.x,y:(1-q)*(1-q)*P0.y+2*(1-q)*q*C.y+q*q*P1.y});
  const FUSE0=.35, FUSE1=1.5; let t=0, done=false;
  FX.push({
    update(dt){
      t+=dt; if(done) return;
      const p=clamp((t-FUSE0)/(FUSE1-FUSE0),0,1), tip=bez(1-p);
      spark(tip.x,tip.y,rand(-70,70),rand(-130,-30),{life:rand(.2,.45),h:rand(30,55),l:rand(60,95),size:2,g:300,drag:.95});
      light(tip.x,tip.y,34,40,.06,.6);
      if(t>=FUSE1){
        done=true; this.done=true;
        const cx=bx, cy=by-6, big=Math.max(W,H);
        flash=1; shake=26; boom(1.5,2400,1.8);
        light(cx,cy,big*.8,25,1.2,.9); light(cx,cy,300*k,50,.7,1);
        shock(cx,cy,big*.95,35,1,16); later(120,()=>shock(cx,cy,big*.7,15,.8,9));
        let ft=0; FX.push({update(d){ft+=d;if(ft>.6)this.done=true;},
          glow(c){const q=ft/.6,rr=30+260*k*(1-Math.pow(1-q,2)),g=c.createRadialGradient(cx,cy,0,cx,cy,rr);
            g.addColorStop(0,`rgba(255,255,220,${1-q})`); g.addColorStop(.35,`rgba(255,170,40,${.8*(1-q)})`); g.addColorStop(1,'rgba(200,40,0,0)');
            c.fillStyle=g; c.beginPath(); c.arc(cx,cy,rr,0,6.2832); c.fill();}});
        burst(cx,cy,{n:260,speed:950*k,hue:30,hueSpread:25,life:1.7,size:3.2,g:420,drag:.955});
        burst(cx,cy,{n:170,speed:600*k,multi:true,life:2,size:2.4,g:300});
        burst(cx,cy,{n:90,speed:760*k,ring:true,hue:50,life:1.4,size:3,g:200});
        burst(cx,cy,{n:80,speed:420*k,hue:50,hueSpread:5,l:90,life:.9,size:3.4,g:200});
        for(let i=0;i<14;i++) later(200+i*110,()=>{ for(let j=0;j<5;j++)
          smoke(cx+rand(-170,170)*k,cy+rand(-120,40)*k,{r:rand(30,60),gr:rand(30,60),life:rand(3.2,4.8),a:.42,tone:rand(110,180),vx:rand(-40,40),vy:-rand(15,45)}); });
      }
    },
    base(c){
      if(done) return;
      const pop=t<.3?1-Math.pow(1-t/.3,3):1, wob=t>FUSE0?Math.sin(t*34)*.035*Math.min(1,(t-FUSE0)*3):0;
      c.save(); c.translate(bx,by); c.rotate(wob); c.scale(pop,pop); c.translate(-bx,-by);
      const g=c.createRadialGradient(bx-r*.35,by-r*.4,r*.1,bx,by,r);
      g.addColorStop(0,'#6b6b78'); g.addColorStop(.35,'#2a2a33'); g.addColorStop(1,'#07070b');
      c.fillStyle=g; c.beginPath(); c.arc(bx,by,r,0,6.2832); c.fill();
      c.fillStyle='#3a3a44'; c.fillRect(bx-r*.28,by-r*1.12,r*.62,r*.3);
      const p=clamp((t-FUSE0)/(FUSE1-FUSE0),0,1), q=1-p;
      c.strokeStyle='#c9a45a'; c.lineWidth=2.4; c.beginPath(); c.moveTo(P0.x,P0.y);
      for(let i=1;i<=10;i++){ const b=bez(q*i/10); c.lineTo(b.x,b.y); } c.stroke();
      c.restore();
    },
    glow(c){ if(done||t<FUSE0) return; const p=clamp((t-FUSE0)/(FUSE1-FUSE0),0,1), tip=bez(1-p);
      c.fillStyle='rgba(255,220,130,.95)'; c.beginPath(); c.arc(tip.x,tip.y,4,0,6.2832); c.fill(); }
  });
}

/* ===========================================================
   4. ROKET – many rockets, each prints the name
   =========================================================== */
function explodeRocket(x,y){
  const k=sc(), h=rand(0,360);
  flash=Math.max(flash,.35); shake=Math.max(shake,8); boom(.9,2200,1);
  light(x,y,W*.45,h,.9,.7); light(x,y,200*k,50,.3,.9);
  shock(x,y,230*k,h,.6,5);
  burst(x,y,{n:150,speed:380*k,hue:h,life:1.5,size:2.4,g:160});
  burst(x,y,{n:90,speed:250*k,multi:true,life:1.7,size:2,g:140});
  burst(x,y,{n:60,speed:480*k,ring:true,hue:(h+180)%360,life:1.3,size:2.6,g:100});
  burst(x,y,{n:40,speed:300*k,multi:true,life:2.2,size:1.8,g:90,tw:.25});
  nameText(CONFIG.PERSON_NAME,x,y,x,y,{maxW:clamp(W*.5,170,380),maxFs:80,cap:600,fly:.8,hold:1.5});
}
function launchRocket(sx,tx,ty,dur){
  const x0=sx,y0=groundY-4, ang=Math.atan2(ty-y0,tx-x0), col=`hsl(${Math.round(rand(0,360))},85%,52%)`;
  let t=0; whoosh(dur);
  FX.push({x:x0,y:y0,
    update(dt){
      t+=dt; const k=Math.min(1,t/dur), e=1-Math.pow(1-k,2.2);
      this.x=x0+(tx-x0)*e+Math.sin(t*25)*2*(1-k); this.y=y0+(ty-y0)*e;
      for(let i=0;i<6;i++){
        const a=ang+Math.PI+rand(-.25,.25), sp=rand(60,200);
        spark(this.x-Math.cos(ang)*14,this.y-Math.sin(ang)*14,Math.cos(a)*sp,Math.sin(a)*sp,{life:rand(.3,.7),h:rand(10,55),l:rand(55,90),size:rand(1.5,3),g:150,drag:.94});
      }
      if(Math.random()<.5) smoke(this.x,this.y,{r:5,gr:22,life:1.4,a:.2,vx:rand(-10,10),vy:rand(0,10)});
      light(this.x,this.y,75,30,.08,.6);
      if(k>=1){ explodeRocket(tx,ty); this.done=true; }
    },
    base(c){
      c.save(); c.translate(this.x,this.y); c.rotate(ang);
      c.strokeStyle='#a07a45'; c.lineWidth=2; c.beginPath(); c.moveTo(-14,0); c.lineTo(-44,0); c.stroke();
      c.fillStyle=col; c.fillRect(-14,-4,24,8);
      c.fillStyle='#ffd24a'; c.beginPath(); c.moveTo(10,-4); c.lineTo(22,0); c.lineTo(10,4); c.fill();
      c.fillStyle='#e01b2f'; c.beginPath(); c.moveTo(-14,-4); c.lineTo(-21,-9); c.lineTo(-7,-4); c.fill();
      c.beginPath(); c.moveTo(-14,4); c.lineTo(-21,9); c.lineTo(-7,4); c.fill();
      c.restore();
    },
    glow(c){
      c.save(); c.translate(this.x,this.y); c.rotate(ang);
      const fl=18+rand(0,14);
      c.fillStyle='rgba(255,150,30,.9)'; c.beginPath(); c.moveTo(-14,-4); c.lineTo(-14-fl,0); c.lineTo(-14,4); c.fill();
      c.fillStyle='rgba(255,250,200,.95)'; c.beginPath(); c.moveTo(-14,-2); c.lineTo(-14-fl*.55,0); c.lineTo(-14,2); c.fill();
      c.restore();
    }});
}
function doRockets(){
  const k=sc(), n=W<600?5:7, slots=[...Array(n).keys()].sort(()=>Math.random()-.5);
  for(let i=0;i<n;i++){
    const slot=slots[i], tx=(slot+.5)/n*W+rand(-.3,.3)*W/n, lev=[.22,.40,.31][slot%3], ty=Math.max(120,groundY*lev)+rand(-8,8);
    const sx=clamp(tx+rand(-80,80),20,W-20), dur=rand(.85,1.15)+(groundY-ty)/groundY*.35;
    later(i*260+(i?rand(0,80):0),()=>launchRocket(sx,tx,ty,dur));
  }
  later(n*260+1500,()=>{   // grand finale
    for(let i=0;i<9;i++) later(i*110,()=>{
      const x=rand(.1,.9)*W, y=rand(.12,.45)*groundY;
      burst(x,y,{n:90,speed:300*k,multi:Math.random()<.6,life:1.3,size:2.2});
      light(x,y,220*k,rand(0,360),.5,.7); boom(.5,2000,.7); flash=Math.max(flash,.12);
    });
  });
}

/* ---------- wiring ---------- */
const ACTIONS={chatai:doChatai,anar:doAnar,bomb:doBomb,rocket:doRockets};
document.querySelectorAll('[data-act]').forEach(b=>b.addEventListener('click',()=>{ initAudio(); ACTIONS[b.dataset.act](); }));

document.getElementById('celebrate').addEventListener('click',()=>{
  initAudio();
  document.getElementById('overlay').classList.add('hide');
  document.body.classList.add('live');
  const k=sc();
  for(let i=0;i<3;i++) later(500+i*250,()=>{
    const x=W*(.25+.25*i), y=groundY*.3;
    burst(x,y,{n:70,speed:240*k,multi:true,life:1.2}); light(x,y,160*k,rand(0,360),.4,.6); boom(.4,1800,.6);
  });
});

addEventListener('resize',resize);
resize();
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(resize);
requestAnimationFrame(frame);
})();
</script>
